<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf9f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="트윈 다이어리">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>트윈 다이어리</title>
<style>
:root{--paper:#fbf9f3;--ink:#1f1f1f;--mute:#8a867c;--line:#d9d4c7;--soft:#efebe1;--accent:#1f1f1f;--hl:#f3efe4;
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e7e3da;color:var(--ink);font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.book{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);margin:14px 0 14px 14px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.08);overflow:hidden}
.page{overflow:auto;padding:22px 26px 28px;min-width:0;-webkit-overflow-scrolling:touch}
.page.r{border-left:1px solid var(--soft);box-shadow:inset 14px 0 18px -16px rgba(0,0,0,.22)}
.tabs{display:flex;flex-direction:column;gap:6px;padding:26px 8px 14px 0;flex:0 0 auto;overflow-y:auto}
.tabs button{writing-mode:vertical-rl;letter-spacing:.18em;font-size:10px;padding:12px 6px;border:1px solid var(--line);border-left:0;background:var(--paper);color:var(--mute);border-radius:0 5px 5px 0;min-height:58px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs .sp{flex:1}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:1.5px solid var(--ink);padding-bottom:6px;margin-bottom:14px;min-height:42px}
.ph h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ph h1 small{font-size:12px;color:var(--mute);font-weight:400;margin-left:6px;letter-spacing:0}
.nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10px;letter-spacing:.14em;color:var(--mute);white-space:nowrap}
.nav button,.lnk{border:0;background:none;padding:8px 6px;color:var(--mute);font-size:10px;letter-spacing:.14em}
.nav button:hover,.lnk:hover{color:var(--ink)}
.lbl{font-size:10px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;margin:16px 0 4px;display:flex;justify-content:space-between;align-items:center}
.lbl:first-child{margin-top:0}
textarea,.in{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0;outline:0;resize:vertical;border-radius:0}
textarea{min-height:64px;background-image:linear-gradient(transparent 27px,var(--soft) 28px);background-size:100% 28px;line-height:28px;padding:0}
textarea:focus,.in:focus{border-bottom-color:var(--ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 14px;border-radius:4px;font-size:12px;min-height:38px}
.btn.g{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4}
.mute{color:var(--mute)}.sm{font-size:12px}
.ck{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--soft);min-height:36px}
.ck input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink);flex:0 0 auto;margin:0}
.ck .in{border:0;padding:6px 0}
.ck.done .in{text-decoration:line-through;color:var(--mute)}
.ck .x{border:0;background:none;color:var(--mute);padding:6px 8px;font-size:15px;opacity:.5}
.ck .x:hover{opacity:1}
.add{display:flex;align-items:center;gap:8px;color:var(--mute);min-height:36px}
.add .in{border:0}
/* calendar */
.cal{display:grid;border-top:1px solid var(--ink);border-left:1px solid var(--line)}
.cal .hd{font-size:10px;letter-spacing:.14em;text-align:center;padding:4px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--ink);color:#555}
.cal .c{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:92px;padding:3px 4px;position:relative;overflow:hidden;cursor:pointer;background-size:cover;background-position:center}
.cal .c.o{background-color:#f4f1e9;color:#bbb}
.cal .c.t{background-color:var(--hl)}
.cal .c .n{border:0;background:none;padding:0 3px;font-size:11px;font-weight:600}
.cal .c.t .n{text-decoration:underline}
.cal .c.pic .n{background:rgba(255,255,255,.85);border-radius:3px}
.cal .wk{font-size:9px;color:var(--mute);writing-mode:vertical-rl;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);letter-spacing:.1em;padding-top:6px}
.ev{font-size:10.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ev b{font-weight:500;color:var(--mute);margin-right:3px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink);vertical-align:middle;margin-left:3px}
.fill{display:flex;flex-direction:column}.fill .cal{flex:1 0 auto;grid-template-rows:auto repeat(var(--rows),minmax(92px,1fr))}
.memo{border:1px solid var(--line);border-left:0;border-top:1px solid var(--ink);padding:6px 8px}
/* year */
.yr{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.mb{border-top:1px solid var(--ink);padding-top:6px;min-height:130px}
.mb h3{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between;cursor:pointer}
.mb h3 span{color:var(--mute);font-weight:400;font-size:11px}
.mb li{font-size:11.5px;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb ul{margin:0;padding:0}
/* week */
.wd{display:grid;grid-template-columns:52px 1fr;border-bottom:1px solid var(--line);min-height:76px}
.wd .dl{border-right:1px solid var(--line);padding:6px 4px;cursor:pointer}
.wd .dl b{font-size:18px;display:block;line-height:1}
.wd .dl span{font-size:9px;letter-spacing:.14em;color:var(--mute)}
.wd .bd{padding:4px 8px;min-width:0}
/* day */
.tm{display:flex;gap:16px;align-items:center;font-size:10px;letter-spacing:.14em;color:var(--mute);flex-wrap:wrap}
.tm input{border:0;border-bottom:1px solid var(--line);background:none;padding:4px 0;width:96px;color:var(--ink);font-size:13px}
.photo{border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--mute);cursor:pointer;background-size:cover;background-position:center;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:12px;min-height:34px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;border-top:1px solid var(--ink);padding-top:8px;font-size:11px;color:var(--mute);flex-wrap:wrap}
/* habit */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div b{display:block;font-size:22px}
.stats div span{font-size:10px;color:var(--mute)}
.heat{display:grid;grid-template-columns:24px repeat(31,minmax(0,1fr));gap:2px;font-size:8px;color:var(--mute)}
.heat>*{min-width:0;overflow:hidden;white-space:nowrap}.heat i{aspect-ratio:1;background:var(--soft);border-radius:2px;display:block}
.hg{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed}
.hg th,.hg td{border-bottom:1px solid var(--soft);text-align:center;padding:0;height:30px}
.hg th.nm,.hg td.nm{text-align:left;width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px;cursor:pointer}
.hg td.c{cursor:pointer}
.hg td.c.on::after{content:"";display:block;width:70%;aspect-ratio:1;margin:auto;background:var(--ink);border-radius:2px}
.hg td.c.off::after{content:"";display:block;width:70%;aspect-ratio:1;margin:auto;border:1px solid var(--line);border-radius:2px}
.hg td.c.fut{opacity:.35}
.hl{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--soft);min-height:38px;cursor:pointer}
.hl.offh{opacity:.45}
/* notes */
.nl{display:flex;gap:10px;border-bottom:1px solid var(--soft);padding:9px 0;cursor:pointer}
.nl.sel{background:var(--hl)}
.nl .d{color:var(--mute);font-size:11px;width:44px;flex:0 0 auto}
.tag{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--mute)}
/* dialog / toast */
.dim{position:fixed;inset:0;background:rgba(30,28,24,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--paper);border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:min(440px,100%);padding:18px 20px;max-height:90vh;overflow:auto}
.dlg h2{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;border-bottom:1.5px solid var(--ink);padding-bottom:6px}
.dlg label{display:block;font-size:10px;letter-spacing:.14em;color:var(--mute);margin-top:12px}
.dlg .in,.dlg select{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;min-height:38px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:4px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.set section{border-top:1px solid var(--ink);padding:10px 0 16px}
.set h3{margin:0 0 8px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 12px;font-size:12px;min-height:36px}
.seg button.on{background:var(--ink);color:#fff}
.empty{color:var(--mute);text-align:center;padding:40px 0;font-size:12px}
.loading{margin:auto;color:var(--mute);font-size:13px}
/* ---- narrow: phones, Flip, Fold cover ---- */
@media (max-width:639px){
  #app{flex-direction:column}
  .book{grid-template-columns:1fr;margin:0;border-radius:0;overflow:auto;box-shadow:none;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .page{overflow:visible;padding:16px 14px 18px}
  .page.r{border-left:0;box-shadow:none;border-top:6px solid #ece8df}
  .tabs{position:fixed;left:0;right:0;bottom:0;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;background:var(--paper);border-top:1px solid var(--line);overflow-x:auto;z-index:20}
  .tabs button{writing-mode:horizontal-tb;border:0;border-radius:4px;min-height:44px;flex:1 1 0;min-width:0;padding:4px 2px;letter-spacing:.02em;overflow:hidden;white-space:nowrap}
  .tabs .sp{display:none}
  @media (max-width:359px){.book{padding-bottom:calc(64px + env(safe-area-inset-bottom))}.tabs{display:grid;grid-template-columns:repeat(4,1fr);row-gap:0}.tabs button{min-height:26px;padding:0;letter-spacing:0;font-size:9px}}
  .cal .c{min-height:58px;padding:2px}
  .ev{font-size:9.5px}
  .yr{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hg th.nm,.hg td.nm{width:70px}
}
@media (max-width:360px){ .ph h1{font-size:20px} .cal .hd{font-size:8px;letter-spacing:0} .page{padding:12px 10px} }
@media (max-width:359px){ .ph{gap:4px;margin-bottom:8px;min-height:0;padding-bottom:4px} .ph h1{font-size:16px} .nav{font-size:9px;letter-spacing:.04em} .cal .c{min-height:38px} .page{padding:8px 8px} }
/* ---- dual screen: Surface Duo / foldables reporting two segments ---- */
@media (horizontal-viewport-segments:2){
  #app{flex-direction:column}
  .book{margin:0;border-radius:0;grid-template-columns:env(viewport-segment-width 0 0) env(viewport-segment-width 1 0);column-gap:calc(env(viewport-segment-left 1 0) - env(viewport-segment-right 0 0));padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .page.r{box-shadow:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:grid;padding:6px 0;gap:0;background:var(--paper);border-top:1px solid var(--line);z-index:20;
    grid-template-columns:repeat(4,calc(env(viewport-segment-width 0 0) / 4)) calc(env(viewport-segment-left 1 0) - env(viewport-segment-right 0 0)) repeat(4,calc(env(viewport-segment-width 1 0) / 4))}
  .tabs button{writing-mode:horizontal-tb;border-radius:4px;min-height:44px;margin:0 3px;min-width:0;letter-spacing:.06em}
  .tabs>button:nth-child(-n+4){order:0}.tabs .sp{order:1;display:block}.tabs>button:nth-child(n+5){order:2}
}
@media (vertical-viewport-segments:2){
  .book{grid-template-columns:1fr;grid-template-rows:env(viewport-segment-height 0 0) env(viewport-segment-height 0 1);row-gap:calc(env(viewport-segment-top 0 1) - env(viewport-segment-bottom 0 0))}
  .page.r{border-left:0;box-shadow:none}
}
@media print{.tabs,#toast{display:none}.book{box-shadow:none}}
</style>
</head>
<body>
<div id="app"><div class="loading" id="boot">불러오는 중…</div></div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
"use strict";
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ym=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,1);
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const DOWK=["일","월","화","수","목","금","토"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return[y,Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)]}
const todayStr=()=>ymd(new Date());
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2600)}
function getPath(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split(".");let a=o;ks.slice(0,-1).forEach((k,i)=>{if(a[k]==null)a[k]=/^\d+$/.test(ks[i+1])?[]:{};a=a[k]});a[ks.at(-1)]=v}

/* ================= store =================
   Artifact (claude.ai): per-person private db  → every device signed in to Claude sees the same diary.
   Standalone (GitHub Pages / PWA): this browser's localStorage + JSON backup file. */
const LS="twd:";
/* Writes are per field ("sub" = first path segment, e.g. one day of a month doc) so two devices
   editing different days of the same month never overwrite each other. */
const S={mode:"local",cache:{},timers:{},inflight:{},pend:{},subs:{},fail:{},known:new Set(),col:null,
  get(k,def){if(!(k in this.cache))this.cache[k]=def===undefined?{}:JSON.parse(JSON.stringify(def));return this.cache[k]},
  mark(k,sub){if(this.subs[k]==="all")return;if(sub==null){this.subs[k]="all";return}(this.subs[k]||(this.subs[k]=new Set())).add(String(sub))},
  save(k,ms=500,sub){this.mark(k,sub);clearTimeout(this.timers[k]);this.timers[k]=setTimeout(()=>{delete this.timers[k];this.flush(k)},ms);saveStatus()},
  async flush(k){
    if(this.inflight[k]){this.pend[k]=1;return}
    const subs=this.subs[k];delete this.subs[k];this.inflight[k]=1;saveStatus();
    try{
      if(this.mode==="db"){const ref=this.col.doc(k);
        if(subs&&subs!=="all"&&this.known.has(k)){const patch={};for(const f of subs)patch[f]=this.cache[k][f]===undefined?null:this.cache[k][f];
          try{await ref.update(patch)}catch(e){if(e&&e.code==="invalid_argument")await ref.set(this.cache[k]);else throw e}}
        else await ref.set(this.cache[k]);
        this.known.add(k)}
      else localStorage.setItem(LS+k,JSON.stringify(this.cache[k]));
      this.fail[k]=0;
    }catch(e){
      if(!subs||subs==="all")this.mark(k);else subs.forEach(f=>this.mark(k,f));
      this.fail[k]=(this.fail[k]||0)+1;
      toast(e&&e.name==="QuotaExceededError"?"이 기기 저장 공간이 가득 찼어요. 사진을 줄이거나 백업 후 정리하세요.":"저장 실패, 다시 시도해요: "+(e.code||e.message||e));
      if(this.fail[k]<5)this.save(k,3000*this.fail[k]);
    }
    this.inflight[k]=0;
    if(this.pend[k]){this.pend[k]=0;await this.flush(k)}
    saveStatus();
  },
  flushAll(){for(const k of Object.keys(this.timers)){clearTimeout(this.timers[k]);delete this.timers[k];this.flush(k)}},
  keys(){return Object.keys(this.cache)},
  busy(k){return !!(this.timers[k]||this.inflight[k]||this.subs[k])}
};
function saveStatus(){const ks=Object.keys(S.cache);const failing=ks.some(k=>S.fail[k]),busy=ks.some(k=>S.busy(k));
  const t=failing?"저장 실패 — 다시 시도 중":busy?"저장 중…":"저장됨";document.querySelectorAll(".sstat").forEach(e=>{e.textContent=t;e.dataset.state=failing?"fail":busy?"busy":"ok"})}
addEventListener("pagehide",()=>S.flushAll());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")S.flushAll()});
function loadLocal(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(LS))o[k.slice(LS.length)]=JSON.parse(localStorage.getItem(k))}}catch(e){}return o}

/* ================= state ================= */
const VIEWS=["year","month","week","day","notes","habit","setting"];
const st={view:"month",date:todayStr(),photo:false,note:null,hmonth:ym(new Date())};
const cfg=()=>S.get("settings",{weekStart:1,photos:true,gcal:false,calId:"",noteCats:["책","영화","맛집","생각"],notion:null});
const mqWide=matchMedia("(min-width:640px), (horizontal-viewport-segments:2)");
let CL=null,MCP=null,ASSETS=null,DL=null;
const NOTION="Notion",GCAL="Google Calendar";

/* ================= data helpers ================= */
const dayDoc=ds=>S.get("d-"+ds.slice(0,7),{});
const okPhoto=u=>typeof u==="string"&&/^(data:image\/[a-z0-9.+-]+;base64,[a-z0-9+\/=]+|(https?:\/\/|\/)[^\s'"()\\<>]*)$/i.test(u)?u:"";
const day=ds=>{const m=dayDoc(ds),k=ds.slice(8);return m[k]||(m[k]={})};
const monthDoc=k=>S.get("m-"+k,{goals:[],periodLog:"",keywords:{}});
const photos=k=>S.get("p-"+k,{});
const weekStart=d=>{const ws=cfg().weekStart;return addDays(d,-((d.getDay()-ws+7)%7))};
const weekKey=d=>"w-"+ymd(weekStart(d));
const weekDoc=d=>S.get(weekKey(d),{goals:[],periodLog:"",memo:""});
const weekNo=d=>isoWeek(addDays(weekStart(d),cfg().weekStart===0?1:0))[1];
const habits=()=>S.get("habits",{list:[],log:{}});
const notesDoc=y=>S.get("n-"+y,{list:[]});
const localEv=k=>S.get("ev-"+k,{list:[]});
const hasDiary=ds=>{const d=dayDoc(ds)[ds.slice(8)];return !!d&&Object.entries(d).some(([k,v])=>k!=="ns"&&k!=="ed"&&(Array.isArray(v)?v.length:v))};
const isUnsaved=ds=>{const d=dayDoc(ds)[ds.slice(8)];return !!(cfg().notion&&d&&d.ed&&(!d.ns||d.ed>d.ns))};
function markUnsaved(ds){day(ds).ed=new Date().toISOString();S.save("d-"+ds.slice(0,7),500,ds.slice(8));const el=$("#nstat");if(el&&cfg().notion)el.textContent="노션에 저장 안 됨"}

/* ================= Google Calendar (artifact connector) ================= */
const gc={byDate:{},watches:{},order:[],err:null};
function gcOn(){return !!(MCP&&cfg().gcal)}
function ensureMonth(k){
  if(!gcOn()||gc.watches[k])return;
  const[y,m]=k.split("-").map(Number);
  const input={startTime:`${k}-01T00:00:00`,endTime:`${ym(new Date(y,m,1))}-01T00:00:00`,pageSize:250,orderBy:"startTime"};
  if(cfg().calId)input.calendarId=cfg().calId;
  gc.watches[k]=MCP.watchTool(GCAL,"list_events",input,ev=>{
    if(ev.type==="error"){gc.err=ev.error;if(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required"].includes(ev.error.code)){clearMonth(k)}renderSoon();return}
    gc.err=null;clearMonth(k);
    const p=ev.result.payload||{};(p.events||[]).forEach(e=>addG(e,k));renderSoon();
    if(p.nextPageToken)morePages(k,input,p.nextPageToken);
  },{refetchInterval:60000});
  gc.order.push(k);
  while(gc.order.length>24){const old=gc.order.shift();gc.watches[old]&&gc.watches[old]();delete gc.watches[old];clearMonth(old)}
}
function addG(e,k){if(!e||e.status==="cancelled")return;const s=e.start||{},en=e.end||{};let sd,ed,time="";
  if(s.dateTime){sd=new Date(s.dateTime);if(isNaN(sd))return;time=`${pad(sd.getHours())}:${pad(sd.getMinutes())}`;const de=en.dateTime?new Date(en.dateTime):sd;ed=new Date(Math.max(sd,de-1))}
  else if(s.date){sd=parse(s.date);ed=en.date?addDays(parse(en.date),-1):sd;if(ed<sd)ed=sd}else return;
  const first=ymd(sd);
  for(let d=new Date(sd.getFullYear(),sd.getMonth(),sd.getDate()),i=0;d<=ed&&i<62;d=addDays(d,1),i++){const ds=ymd(d);if(!ds.startsWith(k))continue;
    const L=gc.byDate[ds]||(gc.byDate[ds]=[]);if(!L.some(x=>x.id===e.id))L.push({id:e.id,title:e.summary||"(제목 없음)",time:ds===first?time:"",src:"g",multi:ymd(ed)!==first})}}

function mcpMsg(e,srv){const c=e&&e.code;
  if(c==="needs_reauth")return`${srv} 연결이 만료됐어요. claude.ai 설정 → 커넥터에서 다시 연결하세요.`;
  if(c==="server_not_connected")return`${srv}가 연결돼 있지 않아요. claude.ai 설정 → 커넥터에서 추가하세요.`;
  if(c==="approval_required"||c==="consent_required"||c==="not_in_manifest")return`${srv} 사용을 허용해야 해요. 다시 눌러 허용을 선택하세요.`;
  if(c==="selection_required")return`같은 이름의 ${srv}가 여러 개예요. 화면 위 안내에서 하나를 고르세요.`;
  if(c==="blocked_by_policy")return`조직 정책으로 ${srv}를 쓸 수 없어요.`;
  if(c==="server_unavailable"||c==="upstream_error")return`${srv}가 잠시 응답하지 않아요. 잠시 뒤 다시 시도하세요.`;

function idsFrom(r,skip=[]){

  for(const m of txt.matchAll(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-f]{32}/gi)){const id=m[0].replace(/-/g,"").toLowerCase();if(!out.includes(id)&&!sk.includes(id))out.push(id)}
  return out}

/* HABIT */
function streak(h,log){let n=0;for(let d=new Date();;d=addDays(d,-1)){const ds=ymd(d);if(log[ds])n++;else if(ds!==todayStr())break;if(n>3660)break}return n}
function vHabit(){const H=habits(),act=H.list.filter(h=>h.on!==false),t=todayStr(),y=new Date().getFullYear();
  const hm=parse(st.hmonth+"-01"),hy=hm.getFullYear(),hmo=hm.getMonth(),nd=daysIn(hy,hmo);
  const elapsed=st.hmonth<t.slice(0,7)?nd:st.hmonth>t.slice(0,7)?0:new Date().getDate();
  let tot=0,dn=0;act.forEach(h=>{for(let d=1;d<=elapsed;d++){const ds=`${st.hmonth}-${pad(d)}`;if(h.start&&h.start>ds)continue;tot++;if(H.log[h.id]&&H.log[h.id][ds])dn++}});
  const best=act.map(h=>({h,s:streak(h,H.log[h.id]||{})})).sort((a,b)=>b.s-a.s)[0];
  const todayDone=act.filter(h=>H.log[h.id]&&H.log[h.id][t]).length;
  let heat=`<div class="heat"><span></span>${Array.from({length:31},(_,i)=>`<span style="text-align:center">${(i+1)%5===0?i+1:""}</span>`).join("")}`;
  for(let m=0;m<12;m++){heat+=`<span>${MON[m].slice(0,3)}</span>`;for(let d=1;d<=31;d++){if(d>daysIn(y,m)){heat+="<span></span>";continue}const ds=`${y}-${pad(m+1)}-${pad(d)}`;const a=H.list.filter(h=>!h.start||h.start<=ds);const c=a.filter(h=>H.log[h.id]&&H.log[h.id][ds]).length;const r=a.length?c/a.length:0;heat+=`<i title="${ds} ${c}/${a.length}" style="${r?`background:rgba(31,31,31,${.15+.85*r})`:""}"></i>`}}
  heat+="</div>";
  const L=`<div class="ph"><h1>Habit<small>${y}</small></h1></div>
   <div class="stats"><div><b>${act.length}개</b><span>진행 중인 습관</span></div><div><b>${todayDone}/${act.length}</b><span>오늘 완료</span></div><div><b>${tot?Math.round(dn/tot*100):0}%</b><span>이 달 전체</span></div><div><b>${best&&best.s?best.s+"일":"–"}</b><span>${best&&best.s?esc(best.h.name)+" 연속":"최장 연속"}</span></div></div>
   <div class="lbl">${y} 하루 달성 비율</div>${heat}
   <div class="lbl">습관 목록</div>${H.list.map(h=>`<div class="hl ${h.on===false?"offh":""}" data-act="habedit" data-h="${esc(h.id)}"><span style="width:22px">${esc(h.icon||"•")}</span><span style="flex:1">${esc(h.name)}</span>${h.cat?`<span class="tag">${esc(h.cat)}</span>`:""}<span class="sm mute">${h.on===false?"꺼짐":streak(h,H.log[h.id]||{})+"일"}</span></div>`).join("")}
   <div class="add">＋<input class="in" placeholder="새 습관 이름 입력 후 Enter" data-addhabit maxlength="60"></div>`;
  let g=`<table class="hg"><thead><tr><th class="nm"></th>${Array.from({length:nd},(_,i)=>`<th>${i+1}<br><span class="mute">${DOW[new Date(hy,hmo,i+1).getDay()][0]}</span></th>`).join("")}<th style="width:30px">%</th></tr></thead><tbody>`;
  act.forEach(h=>{let c=0,n=0;g+=`<tr><td class="nm" data-act="habedit" data-h="${esc(h.id)}">${esc(h.icon||"")} ${esc(h.name)}</td>`;
    for(let d=1;d<=nd;d++){const ds=`${st.hmonth}-${pad(d)}`,on=!!(H.log[h.id]&&H.log[h.id][ds]),fut=ds>t,pre=h.start&&h.start>ds;if(!fut&&!pre){n++;if(on)c++}
      g+=`<td class="c ${on?"on":"off"} ${fut||pre?"fut":""}" data-act="hab" data-h="${esc(h.id)}" data-ds="${ds}" title="${ds}"></td>`}
    g+=`<td>${n?Math.round(c/n*100):0}</td></tr>`});
  g+="</tbody></table>"+(act.length?"":`<div class="empty">진행 중인 습관이 없어요</div>`);
  const R=`<div class="ph"><h1 style="font-size:14px;letter-spacing:.16em">${MON[hmo].toUpperCase()} <small>${hy}</small></h1><div class="nav"><button data-act="hm" data-n="-1">◂ PREV</button><span>|</span><button data-act="hm" data-n="1">NEXT ▸</button></div></div><div style="overflow-x:auto">${g}</div>`;
  return[L,R]}

  case"photos":c.photos=a.dataset.v==="1";if(!c.photos)st.photo=false;S.save("settings",0);render();break;
  case"rmcat":c.noteCats.splice(+a.dataset.i,1);S.save("settings",0);render();break;
  case"gcal":c.gcal=a.dataset.v==="1";S.save("settings",0);resetGcal();render();if(c.gcal)loadCals();break;
  case"loadcals":loadCals();break;
  case"nsetup":notionSetup(a);break;
  case"nall":notionCreateAll(a);break;
  case"export":exportData();break;
  case"import":$("#importFile").value="";$("#importFile").click();break;
  }});
async function loadCals(){if(!MCP)return;try{const r=await MCP.callTool(GCAL,"list_calendars",{});const p=r.payload||{};gcCals=(p.items||p.calendars||[]).map(x=>({id:x.id,summary:x.summary||x.summaryOverride}));render()}catch(e){toast(mcpMsg(e,GCAL))}}
async function exportData(){const data=JSON.stringify({app:"twin-diary",v:1,at:new Date().toISOString(),docs:Object.fromEntries(S.keys().map(k=>[k,S.cache[k]]))},null,1);const name=`twin-diary-${todayStr()}.json`;
  if(DL){try{await DL.save({filename:name,data});toast("백업 파일을 저장했어요")}catch(e){toast("저장을 취소했거나 실패했어요")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("백업 파일을 저장했어요")}
const KEY_OK=/^(settings|nmap|habits|[dmp]-\d{4}-\d\d|ev-\d{4}-\d\d|w-\d{4}-\d\d-\d\d|n-\d{4})$/;
const safeJSON=t=>JSON.parse(t,(k,v)=>k==="__proto__"||k==="constructor"||k==="prototype"?undefined:v);
$("#importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const j=safeJSON(await f.text());if(!j||j.app!=="twin-diary"||!j.docs||typeof j.docs!=="object")throw new Error("트윈 다이어리 백업 파일이 아니에요");
  let n=0;for(const[k,v]of Object.entries(j.docs)){if(!KEY_OK.test(k)||typeof v!=="object"||!v||Array.isArray(v))continue;S.cache[k]=v;S.save(k,0);n++}toast(`${n}개 항목을 불러왔어요`);resetGcal();render()}catch(err){toast("불러오기 실패: "+err.message)}});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)&&h!==st.view){st.view=h;render()}});
mqWide.addEventListener?.("change",()=>render());

/* ================= boot ================= */
async function boot(){
  try{const u=JSON.parse(localStorage.getItem("twd-ui")||"{}");if(VIEWS.includes(u.view))st.view=u.view;st.photo=!!u.photo}catch(e){}
  const h=location.hash.slice(1);if(VIEWS.includes(h))st.view=h;
  CL=window.claude&&typeof window.claude.use==="function"?window.claude:null;
  if(CL){
    try{const[db,user]=await Promise.all([CL.use("db"),CL.use("user")]);const id=user&&await user.id();
      if(db&&id){S.col=db.collection("data/users/"+id);
        const snap=await Promise.race([S.col.limit(1000).get(),new Promise((_,no)=>setTimeout(()=>no(new Error("timeout")),10000))]);
        S.mode="db";snap.docs.forEach(d=>{S.cache[d.id]=JSON.parse(JSON.stringify(d.data()));S.known.add(d.id)});
        if(snap.empty){const loc=loadLocal();for(const[k,v]of Object.entries(loc)){S.cache[k]=v;S.save(k,0)}}
        S.col.onSnapshot(sn=>{let ch=false;for(const c of sn.docChanges()){const k=c.doc.id;
            if(c.type==="removed"){if(!S.busy(k)&&k in S.cache){delete S.cache[k];S.known.delete(k);ch=true}continue}
            S.known.add(k);const remote=JSON.parse(JSON.stringify(c.doc.data()||{}));
            if(!S.busy(k)){if(JSON.stringify(S.cache[k])!==JSON.stringify(remote)){S.cache[k]=remote;ch=true}continue}
            const mine=S.subs[k];if(mine==="all")continue;const cur=S.get(k);   // keep fields this device is still writing, take the rest
            for(const f of Object.keys(remote))if(!(mine&&mine.has(f))&&JSON.stringify(cur[f])!==JSON.stringify(remote[f])){cur[f]=remote[f];ch=true}}
          if(ch)renderSoon()},()=>{});
      }}catch(e){S.mode="local";toast("클로드 저장소에 닿지 않아 이 기기에 저장해요")}
    [MCP,ASSETS,DL]=await Promise.all([CL.use("mcp"),CL.use("assets"),CL.use("downloads")]).catch(()=>[null,null,null]);
  }
  if(S.mode==="local")Object.assign(S.cache,loadLocal());
  if(!CL&&"serviceWorker"in navigator&&window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});
  render();saveStatus();resendNotion();
}
boot();
</script>
